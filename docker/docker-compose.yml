networks:
  lb-common:
    name: lb-common
    attachable: true
    # driver: overlay

services:
  reverse-proxy:
    image: traefik:v3.6 # The official Traefik docker image
    # network_mode: "host" 
    container_name: traefik
    restart: unless-stopped
    #command: --api --docker
    ports:
      - "80:80"     # The HTTP port
      - "443:443"   # The HTTPS port
      - "90:90"     # The DB port
      - "8081:8080" # The Web UI (enabled by --api)
      - "5672:5672" # The RabbitMQ port
    labels:
      - "traefik.enable=true"
      # HTTP router - redirects to HTTPS
      - "traefik.http.routers.dashboard-http.rule=Host(`dashboard.local.io`)"
      - "traefik.http.routers.dashboard-http.entrypoints=web"
      - "traefik.http.routers.dashboard-http.middlewares=redirect-to-https@file"
      - "traefik.http.routers.dashboard-http.service=api@internal"
      # HTTPS router
      - "traefik.http.routers.dashboard.rule=Host(`dashboard.local.io`)"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.tls=true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./config/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./config/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - ./certs:/etc/certs:ro
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - lb-common
    depends_on:
      sablier:
        condition: service_healthy

  sablier:
    image: sablierapp/sablier:1.10.1
    container_name: sablier
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./config/sablier/sablier.yml:/etc/sablier/sablier.yml:ro
      - ./config/sablier/themes:/etc/sablier/themes:ro
    labels:
      - traefik.enable=false
    healthcheck:
      test: ["CMD", "sablier", "health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - lb-common

